<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.8" />

  <!-- Glowing Ribbon Cloud Shape -->
  <g filter="url(#neonGlow)">
    <!-- Outer Cloud Arc -->
    <path d="M160 360 C100 360 64 316 64 260 C64 208 104 168 156 164 C176 112 228 80 292 80 C364 80 424 128 440 196 C480 206 504 240 504 280 C504 324 468 360 424 360 Z" 
          fill="none" stroke="url(#cloudGrad1)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Stylized Infinite Loop / Backup Wave -->
    <path d="M140 320 C180 320 220 280 260 230 C290 192 324 176 360 184 C400 192 428 228 424 270 C420 310 380 340 330 340 C270 340 230 290 190 290 C160 290 140 305 140 320 Z" 
          fill="none" stroke="url(#cloudGrad2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
