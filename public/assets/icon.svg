<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c35" />
      <stop offset="100%" stop-color="#161c23" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ba5e7" />
      <stop offset="100%" stop-color="#558ecc" />
    </linearGradient>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Squircle Border -->
  <rect x="22" y="22" width="468" height="468" rx="88" fill="none" stroke="url(#blueLine)" stroke-width="16" opacity="0.9" />

  <!-- Cloud CDM Emblem Vector Paths -->
  <g fill="none" stroke="url(#blueLine)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cloud Outer Contour connecting into CDM letters -->
    <path d="M175 365 C115 365 75 325 75 270 C75 215 118 175 170 170 C190 115 242 85 305 85 C375 85 435 130 450 200 C488 212 510 245 510 285 C510 330 472 365 425 365" transform="scale(0.85) translate(45, 55)" />
    
    <!-- Letter 'c' inner curve -->
    <path d="M190 280 C190 245 162 218 127 218 C92 218 65 245 65 280 C65 315 92 342 127 342 C155 342 178 324 187 298" transform="scale(0.85) translate(45, 55)" />

    <!-- Letter 'd' vertical stem and loop -->
    <path d="M265 140 L265 365" transform="scale(0.85) translate(45, 55)" />
    <path d="M265 240 C235 240 210 262 210 295 C210 328 235 350 265 350" transform="scale(0.85) translate(45, 55)" />

    <!-- Letter 'm' curves -->
    <path d="M295 365 L295 240 C295 240 325 240 340 270 C355 240 385 240 405 240 L405 365" transform="scale(0.85) translate(45, 55)" />
  </g>
</svg>
